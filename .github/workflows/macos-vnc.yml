
name: Temporary macOS VNC

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos-vnc:
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Connect Tailscale
        uses: tailscale/github-action@v4.1.3
        with:
          authkey: ${{ secrets.TS_OAUTH_CLIENT_ID}}

      - name: Restore DNS
        shell: bash
        run: |
          sudo networksetup -setdnsservers Ethernet Empty || true

      - name: Check macOS and Tailscale
        shell: bash
        run: |
          set -euo pipefail
          sw_vers
          tailscale status
          tailscale ip -4

      - name: Verify runner environment
        shell: bash
        run: |
          echo "Runner check completed."
          echo "VNC has not yet been configured or verified."
